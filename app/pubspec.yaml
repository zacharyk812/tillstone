name: tillstone
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.2.0
  material_ui: ^1.11.0
  path_provider: ^2.1.6
  tillstone_design_system:
    path: ../packages/design_system
  tillstone_ffi:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
