name: tillstone_design_system
description: Tillstone's design tokens and components. Every pixel of the app comes from here.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Used by lib/testing.dart (golden test helpers); not compiled into the app.
  flutter_test:
    sdk: flutter
  material_ui: ^1.11.0

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  fonts:
    # Inter 4.1 by Rasmus Andersson, SIL Open Font License 1.1 (fonts/Inter-LICENSE.txt)
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
